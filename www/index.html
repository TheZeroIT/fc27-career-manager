<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FC27 Career Manager</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#14202b;--mu:#68788a;--ac:#0a8f5a;--bd:#d8e0e6;--up:#0a8f5a;--dn:#d33;--pt:#2f8f4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#18232f;--tx:#e8eef3;--mu:#8da0b1;--bd:#2a3846;--up:#2fd08a;--dn:#ff6b6b;--pt:#1f6b3a}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#18232f;--tx:#e8eef3;--mu:#8da0b1;--bd:#2a3846;--up:#2fd08a;--dn:#ff6b6b;--pt:#1f6b3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0}h3,h4{margin:8px 0}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 12px;border-bottom:1px solid var(--bd)}
.tab{white-space:nowrap}main{padding:12px;max-width:900px;margin:auto}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
button{cursor:pointer}.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.dng{color:var(--dn);border-color:var(--dn)}
textarea{width:100%;min-height:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.st b{display:block;font-size:22px}.mu,small{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}tr.cl{cursor:pointer}
.pitch{position:relative;height:360px;background:var(--pt);border:2px solid #fff6;border-radius:10px;margin-bottom:10px}
.pn{position:absolute;transform:translate(-50%,-50%);background:#000a;color:#fff;border-radius:8px;padding:2px 5px;font-size:11px;text-align:center;min-width:54px;border:1px solid transparent}.pn.wr{border-color:#f55}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}.rl{width:38px;font-weight:700}.row select{flex:1;min-width:0}
.chip{margin:2px}.mb{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px;z-index:5}
.md{background:var(--card);border-radius:12px;padding:14px;max-width:560px;width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:20}
.badge{font-size:11px;border:1px solid var(--bd);border-radius:10px;padding:1px 7px;color:var(--mu)}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes mpop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}
header{background:linear-gradient(120deg,#0a8f5a,#0b5fa5);color:#fff;border-radius:0 0 16px 16px}
button{transition:transform .12s,background .2s,box-shadow .2s}button:active{transform:scale(.94)}button:hover{box-shadow:0 2px 8px #0003}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0002}
#v.in .card{animation:up .45s both}#v.in .card:nth-child(2){animation-delay:.06s}#v.in .card:nth-child(3){animation-delay:.12s}#v.in .card:nth-child(4){animation-delay:.18s}#v.in .card:nth-child(n+5){animation-delay:.24s}
#v.in .grid .card{animation:up .45s both}
.pn{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}.md{animation:mpop .25s both}
tr.cl{transition:background .15s}tr.cl:hover{background:#0a8f5a22}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dr{stroke-dashoffset:0}}
</style></head><body>
<header><h1>⚽ FC27 Career Manager</h1><div><span id="sea" class="badge"></span> <button onclick="ns()">+ Nuova stagione</button></div></header>
<div id="nav"></div><main id="v"></main><div id="m"></div><div id="c"></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),KEY='fc27-career-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const ROLES=['POR','TS','TD','DC','CDC','CC','COC','AS','AD','ES','ED','ATT'];
const FM={'4-2-3-1':'POR|TS DC DC TD|CDC CDC|AS COC AD|ATT','4-2-1-3':'POR|TS DC DC TD|CDC CDC|COC|AS ATT AD','4-3-3':'POR|TS DC DC TD|CC CDC CC|AS ATT AD','4-4-2':'POR|TS DC DC TD|AS CC CC AD|ATT ATT','3-5-2':'POR|DC DC DC|TS CC CDC CC TD|ATT ATT','4-1-4-1':'POR|TS DC DC TD|CDC|AS CC CC AD|ATT'};
const PR={'Equilibrata':['Equilibrato','Equilibrato','Media'],'Contropiede':['Contropiede','Arretrato','Bassa'],'Possesso palla':['Possesso','Equilibrato','Media'],'Pressing alto':['Equilibrato','Pressing alto','Alta'],'Difensiva':['Equilibrato','Arretrato','Bassa']};
const ST=['Equilibrato','Possesso','Contropiede','Palla lunga'],DF=['Equilibrato','Pressing alto','Arretrato'],LN=['Bassa','Media','Alta'];
const P0=[['POR','M. Thiel',63,92],['POR','P. Heinze',62,85],['ATT','A. Bauer',66,95],['AD/AS','J. Reuter',65,86],['COC','R. De Paula',70,86],['AS/COC','C. Silveira',74,85],['CDC','D. Ziegler',60,86,1],['CDC','M. Casadei',67,85,1],['DC','F. Tahiri',67,90],['TD/TS','E. Markaj',63,81],['TD/TS','F. Gjon',62,84],['CDC','A. Bemzekri',63,90],['TS','K. Min Jun',65,95],['ATT','J. Yoon Su',59,89]];
const S0=[['AS/CC','J. Lobo',70,84],['AS/ED','Y. Queiroz',67,84]];
function mk(a,st){const[r,n,o,p,pl]=a,ro=r.split('/');return{id:uid(),name:n,role:ro[0],sec:ro.slice(1),ovr0:o,pot0:p,plus0:!!pl,hist:[{s:'Stagione 1',ovr:o,pot:p,plus:!!pl}],status:st,reg:today(),regS:'Stagione 1',buy:null,sell:null,note:'',loans:[]}}
function seed(){const pl=P0.map(a=>mk(a,'attivo'));S0.forEach(a=>{const p=mk(a,'ceduto');p.sell={d:'',price:null};pl.push(p)});return{v:1,seasons:['Stagione 1'],players:pl,forms:[],log:[]}}
function mig(j){j.forms=j.forms||[];j.log=j.log||[];j.seasons=j.seasons||['Stagione 1'];j.v=1;return j}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.players)return mig(j)}catch(e){}return seed()}
let S=load(),T='dash',FID=null,F={q:'',role:'',st:'attivo',min:0,sort:'pot'},FF={role:'',pot:0},G={t:90,m:'4-2-3-1'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Salvataggio locale non riuscito: fai un backup')}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
const lg=t=>{S.log.unshift({d:new Date().toISOString().slice(0,16),t});S.log=S.log.slice(0,200)};
const fp=(v,pl)=>v+(pl?'+':''),cur=p=>p.hist[p.hist.length-1],prev=p=>p.hist.length>1?p.hist[p.hist.length-2]:null,gp=id=>S.players.find(p=>p.id==id);
const dl=d=>d==null?'–':d==0?'<span class=mu>=</span>':d>0?`<b class=up>▲${d}</b>`:`<b class=dn>▼${-d}</b>`;
const opts=(l,s)=>l.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
const roles=p=>[p.role,...p.sec].join('/'),can=(p,r)=>p.role==r||p.sec.includes(r);
function sl(m){const rows=FM[m].split('|'),o=[];rows.forEach((r,i)=>{const a=r.split(' ');a.forEach((ro,j)=>o.push({r:ro,x:(j+1)/(a.length+1)*100,y:92-i*(76/(rows.length-1))}))});return o}
function match(ps,s){const pj=Array(ps.length).fill(-1),ms=Array(s.length).fill(-1);const tr=(i,sn)=>{for(let j=0;j<ps.length;j++)if(!sn[j]&&can(ps[j],s[i].r)){sn[j]=1;if(pj[j]<0||tr(pj[j],sn)){pj[j]=i;ms[i]=j;return 1}}return 0};s.forEach((_,i)=>tr(i,{}));return ms}
function modal(h){$('m').innerHTML=`<div class=mb onclick="if(event.target==this)cm()"><div class=md>${h}</div></div>`}
const cm=()=>$('m').innerHTML='';
let _f;function cfm(msg,fn){_f=fn;$('c').innerHTML=`<div class=mb style="z-index:9"><div class=md><p>${esc(msg)}</p><button class=dng onclick="cf()">Conferma</button> <button onclick="$('c').innerHTML=''">Annulla</button></div></div>`}
function cf(){const f=_f;$('c').innerHTML='';f()}
function go(k){T=k;R();scrollTo(0,0)}
function R(){$('sea').textContent=S.seasons[S.seasons.length-1];
$('nav').innerHTML=[['dash','Dashboard'],['rosa','Rosa'],['mer','Mercato'],['for','Formazioni'],['obi','Obiettivi'],['dat','Dati']].map(([k,l])=>`<button class="tab ${T==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('v').innerHTML={dash:vDash,rosa:vRosa,mer:vMer,for:vFor,obi:vObi,dat:vDat}[T]()}
/* DASHBOARD */
function vDash(){const A=S.players.filter(p=>p.status=='attivo'),C=A.map(cur),X=S.players.filter(p=>p.status=='ceduto'),ex=C.filter(c=>!c.plus);
const av=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
const top=C.length?C.reduce((m,c)=>c.pot>m.pot?c:m):null;
const th=n=>{const e=ex.filter(c=>c.pot>=n).length,u=C.filter(c=>c.plus&&c.pot>=n).length;return e+(u?` <small>+${u} incerti</small>`:'')};
const un=match(A,sl(G.m)).filter(x=>x<0).length,ch=A.filter(p=>prev(p)&&cur(p).pot!=prev(p).pot);
const by=S.players.filter(p=>p.buy).sort((a,b)=>b.buy.d.localeCompare(a.buy.d)).slice(0,3),sd=S.players.filter(p=>p.sell).sort((a,b)=>b.sell.d.localeCompare(a.sell.d)).slice(0,3);
const t=(l,v)=>`<div class="card st"><small>${l}</small><b>${v}</b></div>`;
return `<div class=grid>${t('Attivi',A.length)}${t('Ceduti',X.length)}${t('POT max',top?fp(top.pot,top.plus):'–')}${t('OVR medio',av(C.map(c=>c.ovr)))}${t('POT medio <small>(solo esatti: '+ex.length+')</small>',av(ex.map(c=>c.pot)))}${t('POT ≥85',th(85))}${t('POT ≥90',th(90))}${t('POT ≥95',th(95))}${t('Ruoli scoperti <small>('+G.m+')</small>',un)}</div>
<div class=card><h4>Ultimi acquisti</h4>${by.map(p=>`${esc(p.name)} <small>${p.buy.d}</small>`).join('<br>')||'<small>Nessun acquisto registrato</small>'}<h4>Ultime cessioni</h4>${sd.map(p=>`${esc(p.name)} <small>${p.sell.d}</small>`).join('<br>')||'<small>Nessuna</small>'}</div>
<div class=card><h4>POT cambiato rispetto alla stagione precedente</h4>${ch.map(p=>`${esc(p.name)} ${fp(prev(p).pot,prev(p).plus)}→${fp(cur(p).pot,cur(p).plus)} ${dl(cur(p).pot-prev(p).pot)}`).join('<br>')||'<small>Nessuna variazione</small>'}</div>`}
/* ROSA */
function vRosa(){return `<div class=bar><input placeholder="Cerca nome" value="${esc(F.q)}" oninput="F.q=this.value;tb()"><select onchange="F.role=this.value;tb()"><option value="">Ruolo</option>${opts(ROLES,F.role)}</select><select onchange="F.st=this.value;tb()">${['attivo','prestito','ceduto','ritirato','tutti'].map(x=>`<option ${F.st==x?'selected':''}>${x}</option>`).join('')}</select><select onchange="F.min=+this.value;tb()">${[0,80,85,90,95].map(x=>`<option value=${x} ${F.min==x?'selected':''}>POT ≥${x}</option>`).join('')}</select><select onchange="F.sort=this.value;tb()">${[['pot','Ordina: POT'],['ovr','OVR'],['gr','Crescita OVR'],['n','Nome']].map(([k,l])=>`<option value=${k} ${F.sort==k?'selected':''}>${l}</option>`).join('')}</select></div><div class=sc id=t>${tbl()}</div>`}
const tb=()=>$('t').innerHTML=tbl();
function tbl(){let L=S.players.filter(p=>(F.st=='tutti'||p.status==F.st)&&(!F.role||can(p,F.role))&&cur(p).pot>=F.min&&p.name.toLowerCase().includes(F.q.toLowerCase()));
const k={pot:p=>-cur(p).pot,ovr:p=>-cur(p).ovr,gr:p=>-(cur(p).ovr-p.ovr0),n:p=>p.name}[F.sort];L.sort((a,b)=>k(a)>k(b)?1:-1);
return `<table><tr><th>Giocatore<th>Ruoli<th>OVR<th>POT<th>Iniz.<th>ΔPOT prec.<th>Stato</tr>${L.map(p=>{const c=cur(p),v=prev(p);return `<tr class=cl onclick="showP('${p.id}')"><td>${esc(p.name)}<td>${roles(p)}<td>${c.ovr}<td>${fp(c.pot,c.plus)}<td><small>${p.ovr0}/${fp(p.pot0,p.plus0)}</small><td>${v?dl(c.pot-v.pot):'–'}<td><small>${p.status}</small></tr>`}).join('')||'<tr><td>Nessun risultato</tr>'}</table>`}
function chart(p){const h=p.hist,v=h.flatMap(x=>[x.ovr,x.pot]),mn=Math.min(...v)-3,mx=Math.max(...v)+3,W=320,H=130,X=i=>20+(h.length>1?i*(W-40)/(h.length-1):(W-40)/2),Y=y=>H-15-(y-mn)/(mx-mn)*(H-30);
const ln=(k,c)=>`<polyline class=dr pathLength=1 fill=none stroke="${c}" stroke-width=2 points="${h.map((x,i)=>X(i)+','+Y(x[k])).join(' ')}"/>`+h.map((x,i)=>`<circle cx=${X(i)} cy=${Y(x[k])} r=3 fill="${c}"/><text x=${X(i)} y=${Y(x[k])-6} font-size=9 text-anchor=middle fill="${c}">${x[k]}</text>`).join('');
return `<svg viewBox="0 0 ${W} ${H}" width=100%>${ln('ovr','#2f8fd0')}${ln('pot','#e8963a')}<line x1=10 x2=${W-10} y1=${Y(p.pot0)} y2=${Y(p.pot0)} stroke=gray stroke-dasharray="3 3"/><text x=14 y=${H-2} font-size=9 fill=gray>blu OVR · arancio POT · tratteggio POT iniziale</text></svg>`}
function showP(id){const p=gp(id),n=p.hist.length,c=cur(p);
modal(`<h3>${esc(p.name)} <small>${roles(p)} · ${p.status}</small></h3><p class=mu>Registrato: ${p.regS}, ${p.reg}. Iniziale: OVR ${p.ovr0} · POT ${fp(p.pot0,p.plus0)}${p.plus0?' (almeno, valore esatto incerto)':''}${p.buy?` · Acquisto ${p.buy.d} ${p.buy.price??''}`:''}${p.sell?` · Cessione ${p.sell.d} ${p.sell.price??''}`:''}</p>
<div class=sc><table><tr><th>Stagione<th>OVR<th>Δprec<th>Δiniz<th>POT<th>Δprec<th>Δiniz</tr>${p.hist.map((x,i)=>{const q=i?p.hist[i-1]:null;return `<tr><td>${esc(x.s)}<td>${x.ovr}<td>${q?dl(x.ovr-q.ovr):'–'}<td>${i?dl(x.ovr-p.ovr0):'–'}<td>${fp(x.pot,x.plus)}<td>${q?dl(x.pot-q.pot):'–'}<td>${i?dl(x.pot-p.pot0):'–'}</tr>`}).join('')}</table></div>${chart(p)}
${p.loans.length?'<h4>Prestiti</h4>'+p.loans.map(l=>`<small>${l.from} → ${l.to||'?'}${l.ret?' (rientrato '+l.ret+')':''}</small>`).join('<br>'):''}
<h4>Aggiorna valori · ${esc(p.hist[n-1].s)}</h4><div class=bar><input id=vo type=number min=1 max=99 value=${c.ovr} style="width:70px"><input id=vp type=number min=1 max=99 value=${c.pot} style="width:70px"><label><input id=vx type=checkbox ${c.plus?'checked':''}> POT "+"</label><button class=pri onclick="svV('${id}')">Salva</button></div>
<h4>Note</h4><textarea id=nt>${esc(p.note)}</textarea><button onclick="svN('${id}')">Salva note</button>
<details><summary>Correggi valori iniziali (solo errori)</summary><div class=bar><input id=io0 type=number value=${p.ovr0} style="width:70px"><input id=ip0 type=number value=${p.pot0} style="width:70px"><label><input id=ix0 type=checkbox ${p.plus0?'checked':''}> "+"</label><button onclick="svI('${id}')">Correggi</button></div></details>
<p><button class=dng onclick="delP('${id}')">Elimina record</button> <button onclick="cm()">Chiudi</button></p>`)}
const okv=v=>v>=1&&v<=99;
function svV(id){const o=+$('vo').value,q=+$('vp').value,x=$('vx').checked;if(!okv(o)||!okv(q))return toast('Valori 1–99');cfm('Aggiornare OVR/POT della stagione corrente? Il valore precedente finisce nel registro.',()=>{const p=gp(id),c=cur(p);lg(`${p.name} ${c.s}: ${c.ovr}/${fp(c.pot,c.plus)} → ${o}/${fp(q,x)}`);c.ovr=o;c.pot=q;c.plus=x;save();showP(id);R()})}
function svI(id){const o=+$('io0').value,q=+$('ip0').value,x=$('ix0').checked;if(!okv(o)||!okv(q))return toast('Valori 1–99');cfm('Correggere i valori INIZIALI? Operazione eccezionale, resta nel registro.',()=>{const p=gp(id);lg(`${p.name} correzione iniziali ${p.ovr0}/${fp(p.pot0,p.plus0)} → ${o}/${fp(q,x)}`);p.ovr0=o;p.pot0=q;p.plus0=x;p.hist[0]={...p.hist[0],ovr:o,pot:q,plus:x};save();showP(id);R()})}
function svN(id){gp(id).note=$('nt').value;save();toast('Note salvate')}
function delP(id){cfm('Eliminare definitivamente il record e tutto il suo storico? (Per una cessione usa il Mercato.)',()=>{S.players=S.players.filter(p=>p.id!=id);S.forms.forEach(f=>{f.slots=f.slots.map(s=>s==id?null:s);f.bench=f.bench.filter(b=>b!=id)});lg('Eliminato record '+id);save();cm();R()})}
function ns(){modal(`<h3>Nuova stagione</h3><input id=nsn value="Stagione ${S.seasons.length+1}"><p class=mu>I valori correnti vengono copiati come punto di partenza; poi li aggiorni a mano dalla scheda giocatore.</p><button class=pri onclick="doNs()">Crea</button> <button onclick="cm()">Annulla</button>`)}
function doNs(){const n=$('nsn').value.trim();if(!n||S.seasons.includes(n))return toast('Nome non valido o già usato');S.seasons.push(n);S.players.forEach(p=>{if(p.status=='attivo'||p.status=='prestito')p.hist.push({...cur(p),s:n})});lg('Nuova stagione '+n);save();cm();R()}
/* MERCATO */
function vMer(){const A=S.players.filter(p=>p.status=='attivo'),sel=`<select id=%>${A.map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select>`,I=(i,pl,t='text',w='')=>`<input id=${i} placeholder="${pl}" type=${t} style="${w}">`;
return `<div class=card><h4>Acquisto</h4><div class=bar>${I('bn','Nome (A. Bauer)')}<select id=br>${opts(ROLES)}</select>${I('bs','Sec. (es. AS/COC)')}${I('bo','OVR','number','width:70px')}${I('bp','POT','number','width:70px')}<label><input id=bx type=checkbox> POT "+"</label>${I('bpr','Prezzo','number','width:100px')}<input id=bd type=date value=${today()}><button class=pri onclick="buy()">Acquista</button></div></div>
<div class=card><h4>Cessione</h4><div class=bar>${sel.replace('%','sp')}${I('spr','Prezzo','number','width:100px')}<input id=sd type=date value=${today()}><button onclick="sell()">Cedi</button></div></div>
<div class=card><h4>Prestito</h4><div class=bar>${sel.replace('%','lp')}<input id=l1 type=date value=${today()}><input id=l2 type=date><button onclick="loan()">Presta</button></div>${S.players.filter(p=>p.status=='prestito').map(p=>`<p>${esc(p.name)} <small>dal ${p.loans.at(-1).from}</small> <button onclick="ret('${p.id}')">Rientro</button></p>`).join('')}</div>
<div class=card><h4>Storico cessioni</h4>${S.players.filter(p=>p.status=='ceduto').map(p=>`<p class=cl onclick="showP('${p.id}')">${esc(p.name)} <small>${roles(p)} · iniz. ${p.ovr0}/${fp(p.pot0,p.plus0)} ${p.sell?.d||''}</small></p>`).join('')||'<small>Nessuna</small>'}</div>`}
function buy(){const n=$('bn').value.trim(),o=+$('bo').value,q=+$('bp').value;if(!n||!okv(o)||!okv(q))return toast('Nome, OVR e POT (1–99) obbligatori');
if(S.players.some(p=>p.name.toLowerCase()==n.toLowerCase()&&p.status!='ceduto'))return toast('Giocatore già presente');
const sec=$('bs').value.split('/').map(x=>x.trim().toUpperCase()).filter(Boolean),p=mk([[$('br').value,...sec].join('/'),n,o,q,$('bx').checked],'attivo');p.regS=S.seasons.at(-1);p.hist[0].s=p.regS;p.buy={d:$('bd').value,price:$('bpr').value?+$('bpr').value:null};lg('Acquisto '+n);S.players.push(p);save();toast('Acquistato');R()}
function rmF(id){S.forms.forEach(f=>{f.slots=f.slots.map(s=>s==id?null:s);f.bench=f.bench.filter(b=>b!=id)})}
function sell(){const id=$('sp')?.value;if(!id)return;cfm('Cedere il giocatore? Resterà nello storico.',()=>{const p=gp(id);p.status='ceduto';p.sell={d:$('sd').value,price:$('spr').value?+$('spr').value:null};rmF(id);lg('Cessione '+p.name);save();R()})}
function loan(){const id=$('lp')?.value;if(!id)return;const p=gp(id);p.status='prestito';p.loans.push({from:$('l1').value,to:$('l2').value});rmF(id);lg('Prestito '+p.name);save();R()}
function ret(id){const p=gp(id);p.status='attivo';p.loans.at(-1).ret=today();lg('Rientro '+p.name);save();R()}
/* FORMAZIONI */
const gf=()=>S.forms.find(f=>f.id==FID);
function newF(){const f={id:uid(),name:'Formazione '+(S.forms.length+1),mod:'4-2-3-1',slots:Array(11).fill(null),bench:[],style:'Equilibrato',def:'Equilibrato',line:'Media',src:'manuale',roles:'',note:''};S.forms.push(f);FID=f.id;save();R()}
function ff(k,v){const f=gf();f[k]=v;if(['style','def','line'].includes(k))f.src='manuale';save();R()}
const fs=(k,v)=>{gf()[k]=v;save()};
function setMod(m){const f=gf();const go=()=>{f.mod=m;f.slots=Array(11).fill(null);save();R()};f.slots.some(Boolean)?cfm('Cambiare modulo azzera gli slot assegnati. Continuare?',go):go()}
function setSl(i,v){const f=gf();if(v&&f.slots.some((s,j)=>s==v&&j!=i))return toast('Giocatore già schierato');f.slots[i]=v||null;f.bench=f.bench.filter(b=>b!=v);save();R()}
function bn(id){const f=gf();f.bench=f.bench.includes(id)?f.bench.filter(b=>b!=id):[...f.bench,id];save();R()}
function preset(k){const f=gf();[f.style,f.def,f.line]=PR[k];f.src='Preset "'+k+'" (suggerimento app)';save();R()}
function delF(){cfm('Eliminare questa formazione?',()=>{S.forms=S.forms.filter(f=>f.id!=FID);FID=null;save();R()})}
function vFor(){const top=`<div class=bar><select onchange="FID=this.value;R()">${S.forms.map(f=>`<option value=${f.id} ${f.id==FID?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button class=pri onclick="newF()">+ Nuova</button></div>`;
if(!S.forms.length)return top+'<p>Nessuna formazione salvata.</p>';
const f=gf()||(FID=S.forms[0].id,S.forms[0]),s=sl(f.mod),A=S.players.filter(p=>p.status=='attivo'),used=f.slots.filter(Boolean),miss=s.filter((_,i)=>!f.slots[i]).map(x=>x.r);
const pitch=s.map((q,i)=>{const p=f.slots[i]&&gp(f.slots[i]);return `<div class="pn ${p&&!can(p,q.r)?'wr':''}" style="left:${q.x}%;top:${q.y}%"><b>${q.r}</b>${p?`<br>${esc(p.name)}<br><small style="color:#ddd">${cur(p).ovr}/${fp(cur(p).pot,cur(p).plus)}</small>`:'<br>—'}</div>`}).join('');
const rows=s.map((q,i)=>{const cs=f.slots[i],p=cs&&gp(cs),L=A.filter(x=>x.id==cs||(!used.includes(x.id)&&(!FF.role||can(x,FF.role))&&cur(x).pot>=FF.pot)).sort((a,b)=>can(b,q.r)-can(a,q.r)||cur(b).pot-cur(a).pot);
return `<div class=row><span class=rl>${q.r}</span><select onchange="setSl(${i},this.value)"><option value="">— vuoto —</option>${L.map(x=>`<option value=${x.id} ${x.id==cs?'selected':''}>${can(x,q.r)?'✓':'⚠'} ${esc(x.name)} ${cur(x).ovr}/${fp(cur(x).pot,cur(x).plus)}</option>`).join('')}</select>${p&&!can(p,q.r)?'<small class=dn>fuori ruolo</small>':''}</div>`}).join('');
return top+`<div class=bar><input value="${esc(f.name)}" onchange="fs('name',this.value)"><select onchange="setMod(this.value)">${opts(Object.keys(FM),f.mod)}</select><button class=dng onclick="delF()">Elimina</button></div><div class=pitch>${pitch}</div>
<p>${miss.length?`<b class=dn>Posizioni scoperte (${miss.length}):</b> ${miss.join(', ')}`:'<b class=up>Undici completo</b>'}</p>
<div class=card><div class=bar><small>Filtra elenco giocatori:</small><select onchange="FF.role=this.value;R()"><option value="">Ruolo</option>${opts(ROLES,FF.role)}</select><select onchange="FF.pot=+this.value;R()">${[0,80,85,90,95].map(x=>`<option value=${x} ${FF.pot==x?'selected':''}>POT ≥${x}</option>`).join('')}</select></div>${rows}</div>
<div class=card><h4>Riserve</h4>${A.filter(p=>!used.includes(p.id)).map(p=>`<button class="chip ${f.bench.includes(p.id)?'on':''}" onclick="bn('${p.id}')">${esc(p.name)}</button>`).join('')||'<small>Nessun giocatore libero</small>'}</div>
<div class=card><h4>Tattiche</h4><p class=mu><small>Impostazioni inserite da te (non verificate per FC 27). Origine: ${esc(f.src)}</small></p><div class=bar>${PR&&Object.keys(PR).map(k=>`<button onclick="preset('${k}')">${k}</button>`).join('')}</div><small>I preset sono suggerimenti dell'app, modificabili, senza garanzia di risultati.</small>
<div class=bar><label>Costruzione <select onchange="ff('style',this.value)">${opts(ST,f.style)}</select></label><label>Difesa <select onchange="ff('def',this.value)">${opts(DF,f.def)}</select></label><label>Linea difensiva <select onchange="ff('line',this.value)">${opts(LN,f.line)}</select></label></div>
<small>Ruoli individuali e compiti (testo libero)</small><textarea onchange="fs('roles',this.value)">${esc(f.roles)}</textarea><small>Note</small><textarea onchange="fs('note',this.value)">${esc(f.note)}</textarea></div>`}
/* OBIETTIVI */
function vObi(){const A=S.players.filter(p=>p.status=='attivo'),E=A.filter(p=>cur(p).pot>=G.t),s=sl(G.m),ms=match(E,s),un=[];
const rows=s.map((q,i)=>{const p=ms[i]>=0&&E[ms[i]];if(!p)un.push(q.r);const best=!p&&A.filter(x=>can(x,q.r)).sort((a,b)=>cur(b).pot-cur(a).pot)[0];return `<tr><td>${q.r}<td>${p?esc(p.name)+' '+fp(cur(p).pot,cur(p).plus)+(cur(p).plus?' <small>(almeno '+cur(p).pot+', esatto incerto)</small>':''):`<b class=dn>SCOPERTO</b>${best?` <small>miglior opzione: ${esc(best.name)} POT ${fp(cur(best).pot,cur(best).plus)}</small>`:''}`}</tr>`}).join('');
const pri={};un.forEach(r=>pri[r]=(pri[r]||0)+1);
return `<div class=bar><label>Soglia POT <input type=number min=60 max=99 value=${G.t} style="width:70px" onchange="G.t=+this.value;R()"></label>${[80,85,90,95].map(x=>`<button class="${G.t==x?'on':''}" onclick="G.t=${x};R()">${x}+</button>`).join('')}<select onchange="G.m=this.value;R()">${opts(Object.keys(FM),G.m)}</select></div>
<div class=card><b>Obiettivo: 11 titolari con POT ${G.t}+ → coperti ${11-un.length}/11</b><p class=mu><small>Giocatori idonei: ${E.length} su ${A.length}. Un giocatore occupa una sola posizione.</small></p><div class=sc><table>${rows}</table></div></div>
<div class=card><h4>Priorità di mercato</h4>${Object.entries(pri).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`${n}× ${r} con POT ${G.t}+`).join('<br>')||'<span class=up>Nessuna: obiettivo raggiunto</span>'}</div>`}
/* DATI */
function vDat(){return `<div class=card><h4>Backup e ripristino</h4><p class=mu><small>Dati salvati nel browser (localStorage). Il backup compare nella casella sotto: copialo e conservalo in un file di testo. Per ripristinare incolla il JSON o scegli un file.</small></p>
<div class=bar><button class=pri onclick="exJ()">Backup completo (JSON)</button><button onclick="exC()">Rosa CSV</button><button onclick="cp()">Copia</button><button onclick="imp()">Ripristina</button><button onclick="test()">Autotest</button></div>
<input type=file accept=".json,.txt" onchange="fl(this)"><textarea id=io style="min-height:160px"></textarea><button class=dng onclick="rst()">Reimposta dati iniziali</button></div>
<div class=card><h4>Registro modifiche</h4>${S.log.slice(0,20).map(l=>`<small>${l.d} · ${esc(l.t)}</small>`).join('<br>')||'<small>Vuoto</small>'}</div>`}
const exJ=()=>{$('io').value=JSON.stringify(S,null,1);$('io').select()};
function exC(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';$('io').value=['id,nome,ruolo,secondari,ovr_iniz,pot_iniz,ovr,pot,stato,stagione_reg,note',...S.players.map(p=>{const c=cur(p);return [p.id,p.name,p.role,p.sec.join('/'),p.ovr0,fp(p.pot0,p.plus0),c.ovr,fp(c.pot,c.plus),p.status,p.regS,p.note].map(q).join(',')})].join('\n')}
function cp(){$('io').select();try{navigator.clipboard.writeText($('io').value);toast('Copiato')}catch(e){document.execCommand('copy')}}
function fl(i){const r=new FileReader();r.onload=()=>$('io').value=r.result;if(i.files[0])r.readAsText(i.files[0])}
function imp(){let j;try{j=JSON.parse($('io').value);if(!Array.isArray(j.players))throw 0}catch(e){return toast('Backup non valido')}cfm('Sostituire tutti i dati attuali con il backup?',()=>{S=mig(j);FID=null;save();R();toast('Ripristinato')})}
function rst(){cfm('Cancellare TUTTO e tornare ai dati iniziali?',()=>{S=seed();FID=null;save();R()})}
function test(){const s=seed(),r=[],ok=(n,c)=>r.push((c?'✅ ':'❌ ')+n),g=n=>s.players.find(p=>p.name==n);
ok('14 attivi + 2 ceduti',s.players.filter(p=>p.status=='attivo').length==14&&s.players.filter(p=>p.status=='ceduto').length==2);
ok('Bauer e Min Jun POT iniziale 95',g('A. Bauer').pot0==95&&g('K. Min Jun').pot0==95);
const b=g('A. Bauer');b.hist.push({s:'S2',ovr:73,pot:92,plus:false});ok('POT attuale cambia, iniziale no',cur(b).pot==92&&b.pot0==95);
ok('85+/86+ distinti dagli esatti',g('D. Ziegler').plus0&&g('M. Casadei').plus0&&!b.plus0);
ok('Backup reimportabile',mig(JSON.parse(JSON.stringify(s))).players.length==16);
const m=match(s.players.filter(p=>p.status=='attivo'),sl('4-3-3'));ok('Nessun giocatore in due slot',new Set(m.filter(x=>x>=0)).size==m.filter(x=>x>=0).length);
$('io').value=r.join('\n')}
R();
let _t;const _R=R;R=function(){_R();anim()};
function anim(){const v=$('v');if(_t!==T){_t=T;v.classList.remove('in');void v.offsetWidth;v.classList.add('in')}
document.querySelectorAll('.st b').forEach(e=>{const x=e.textContent.trim();if(!/^\d+(\.\d+)?$/.test(x))return;const n=parseFloat(x),d=x.includes('.')?1:0,t0=performance.now(),f=q=>{const k=Math.min(1,(q-t0)/700);e.textContent=(n*(1-Math.pow(1-k,3))).toFixed(d);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
anim();
</script></body></html>
