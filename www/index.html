<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FC27 Squad Database</title>
<style>
:root{--bg:#070b09;--card:#101915;--card2:#16231d;--bd:#1e2f27;--tx:#e9f3ee;--mu:#7f9a8d;--ac:#1fe08a;--ac2:#0fbf6f;--up:#1fe08a;--dn:#ff5d6c;--wn:#ffb84d;--ink:#04120b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef3f0;--card:#fff;--card2:#f1f6f3;--bd:#d3dfd8;--tx:#0e1a14;--mu:#5b7367;--ac:#0aa660;--ac2:#08894f;--up:#0aa660;--dn:#d6334a;--wn:#c77b0a;--ink:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body::before,body::after{content:'';position:fixed;z-index:-1;background:var(--ac);opacity:.07;pointer-events:none}
body::before{inset:0;clip-path:polygon(62% 0,100% 0,100% 55%)}body::after{inset:0;clip-path:polygon(0 100%,0 62%,40% 100%)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.5px}h1 svg{color:var(--ac)}h1 .mu{font-weight:400;font-size:14px}h2{margin:2px 0;font-size:28px}h3,h4{margin:8px 0}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--bd)}
.tab{white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--mu);padding:12px 14px;font-weight:600}.tab:hover{color:var(--tx)}.tab.on{color:var(--ac);border-bottom-color:var(--ac);background:none}
main{padding:14px;max-width:1000px;margin:auto}.ph{margin:4px 0 14px}.ph small{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--ac);font-weight:700}.ph p{margin:0;color:var(--mu)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}button:hover{border-color:var(--ac)}button:active{transform:scale(.95)}
.on,.pri{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:700}.dng{color:var(--dn);border-color:var(--dn)}
textarea{width:100%;min-height:60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.f{display:flex;flex-direction:column;gap:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;transition:transform .2s,box-shadow .2s,border-color .2s}.card:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 8px 24px #0006}
.st{border-left:3px solid var(--ac)}.st b{display:block;font-size:24px;margin-top:2px}.mu,small{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--wn)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu)}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}tr.cl{cursor:pointer;transition:background .15s}tr.cl:hover{background:var(--card2);box-shadow:inset 3px 0 var(--ac)}
.rb{display:inline-block;min-width:32px;text-align:center;padding:2px 6px;border-radius:7px;font-weight:800;color:var(--ink)}.r1{background:#5d7066;color:#fff}.r2{background:#b9d94a}.r3{background:#3ddc84}.r4{background:#00f5a0;box-shadow:0 0 10px #00f5a099}
.chip{margin:3px;display:inline-block;border:1px solid var(--bd);background:var(--card2);border-radius:999px;padding:3px 11px;font-size:12px}.chip.w{border-color:var(--dn);color:var(--dn)}
.pb{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);transition:width .8s}
.mb{position:fixed;inset:0;background:#000a;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px;z-index:5}
.md{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:620px;width:100%;animation:mp .25s both}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ink);font-weight:700;padding:8px 16px;border-radius:20px;display:none;z-index:20}
.badge{font-size:12px;border:1px solid var(--ac);color:var(--ac);border-radius:999px;padding:3px 10px}
.pc{font-size:15px;padding:7px 12px}.chip.best{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),0 0 14px #1fe08a55}.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}.ig label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mu)}.ig input{padding:6px 8px;width:100%}
.fld{position:relative;height:440px;max-width:520px;margin:0 auto 10px;border-radius:14px;border:2px solid #ffffff44;overflow:hidden;background:repeating-linear-gradient(#14452c 0 44px,#185135 44px 88px)}.fl{position:absolute;border:2px solid #ffffff44}
.pn2{position:absolute;transform:translate(-50%,-50%);text-align:center;background:#000b;border:2px solid #ffffff33;border-radius:12px;padding:4px 9px;min-width:56px;transition:box-shadow .3s}.pn2 small{color:#cfe8da;font-weight:700}.pn2.best{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),0 0 16px #1fe08a88}
.pn2{font-size:11px}.pn2.wr{border-color:var(--dn)}.row{display:flex;gap:6px;align-items:center;margin:4px 0}.rl{width:40px;font-weight:700}.row select{flex:1;min-width:0}
th[onclick]{cursor:pointer}.pn2[onclick]{cursor:pointer}.rng{width:100%}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes mp{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
#v.in .card{animation:up .45s both}#v.in .card:nth-child(3){animation-delay:.06s}#v.in .card:nth-child(4){animation-delay:.12s}#v.in .card:nth-child(n+5){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 3 24 22H2z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>FC 27 <span class="mu">Squad DB</span></h1><div><select id="cr" onchange="swC(this.value)"></select> <button onclick="mgC()" title="Carriere">⚙</button> <span id="sea" class="badge"></span> <button onclick="tg()" title="Tema">◐</button> <button class="pri" onclick="ns()">+ Stagione</button></div></header>
<div id="nav"></div><main id="v"></main><div id="m"></div><div id="c"></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),KEY='fcdb-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const RO=['POR','TS','TD','DC','CDC','CC','COC','AS','AD','ES','ED','ATT'];
const LS={rosa:'Rosa',riserva:'Riserva',trasf:'Lista trasferimenti',prestiti:'Lista prestiti',oss:'Osservati'};
const CT=['Turnover','Sporadico','Cruciale','Importante','Promessa'];
const P0=[['POR','M. Thiel',63,92],['POR','P. Heinze',62,85],['ATT','A. Bauer',66,95],['AD/AS','J. Reuter',65,86],['COC','R. De Paula',70,86],['AS/COC','C. Silveira',74,85],['CDC','D. Ziegler',60,86,1],['CDC','M. Casadei',67,85,1],['DC','F. Tahiri',67,90],['TD/TS','E. Markaj',63,81],['TD/TS','F. Gjon',62,84],['CDC','A. Bemzekri',63,90],['TS','K. Min Jun',65,95],['ATT','J. Yoon Su',59,89]];
function mk(a){const[r,n,o,p,pl]=a,ro=r.split('/');return{id:uid(),name:n,role:ro[0],sec:ro.slice(1),age:null,ovr:o,pot:p,plus:!!pl,ovr0:o,pot0:p,plus0:!!pl,val:null,wage:null,ct:'',yrs:null,list:'rosa',inj:false,note:'',hist:[{s:'Stagione 1',ovr:o,pot:p,plus:!!pl}]}}
const seed=()=>({v:1,seasons:['Stagione 1'],bud:null,wb:null,players:P0.map(mk),log:[],scout:[],forms:[]});
const mig=j=>{j.log=j.log||[];j.scout=j.scout||[];j.forms=j.forms||[];migX(j);j.seasons=j.seasons||['Stagione 1'];j.v=1;return j};
function load(){try{const j=JSON.parse(localStorage.getItem('fcdb-c-'+CI.cur));if(j&&j.players)return mig(j)}catch(e){}return emptyD()}
const IDX='fcdb-index';
function emptyD(){return{v:1,seasons:['Stagione 1'],bud:null,wb:null,players:[],log:[],scout:[],forms:[]}}
function loadIdx(){try{const j=JSON.parse(localStorage.getItem(IDX));if(j&&j.list&&j.list.length)return j}catch(e){}
const id=uid(),idx={cur:id,list:[{id,name:'Carriera 1'}]};let old=null;try{old=localStorage.getItem(KEY)}catch(e){}
try{localStorage.setItem('fcdb-c-'+id,old||JSON.stringify(seed()));localStorage.setItem(IDX,JSON.stringify(idx))}catch(e){}return idx}
let CI=loadIdx(),S=load(),T='dash',F={q:'',l:'rosa',role:'',sort:'ovr'};
const save=()=>{try{localStorage.setItem('fcdb-c-'+CI.cur,JSON.stringify(S))}catch(e){toast('Salvataggio non riuscito: fai un backup')}};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
const gp=id=>S.players.find(p=>p.id==id),can=(p,r)=>p.role==r||p.sec.includes(r),sea=()=>S.seasons[S.seasons.length-1];
const pm=s=>{s=String(s??'').trim().toLowerCase().replace(',','.');if(!s)return null;const m=s.endsWith('m')?1e6:s.endsWith('k')?1e3:1,n=parseFloat(s);return isNaN(n)?null:Math.round(n*m)};
const fm=n=>n==null?'–':(Math.abs(n)>=1e6?+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?Math.round(n/1e3)+'K':n)+' €';
const opts=(l,s)=>l.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join(''),lopt=s=>Object.entries(LS).map(([k,v])=>`<option value=${k} ${s==k?'selected':''}>${v}</option>`).join('');
const lg=(t,amt=0)=>{S.log.unshift({d:today(),t,amt});S.log=S.log.slice(0,300)};
function modal(h){$('m').innerHTML=`<div class=mb onclick="if(event.target==this)cm()"><div class=md>${h}</div></div>`}const cm=()=>$('m').innerHTML='';
let _f;function cfm(msg,fn){_f=fn;$('c').innerHTML=`<div class=mb style="z-index:9"><div class=md><p>${esc(msg)}</p><button class=dng onclick="cf()">Conferma</button> <button onclick="$('c').innerHTML=''">Annulla</button></div></div>`}
function cf(){const f=_f;$('c').innerHTML='';f()}
const go=k=>{T=k;R();scrollTo(0,0)};
const rb=n=>`<span class="rb r${n>=90?4:n>=80?3:n>=70?2:1}">${n}</span>`;
const PH={dash:['Squadra · Panoramica','Dashboard','Riepilogo di rosa, contratti e budget.'],db:['Squadra · Giocatori','Database','Tutti i giocatori, divisi per lista.'],for:['Squadra · Tattica','Formazioni','Schiera gli undici, scegli modulo e tattiche.'],con:['Squadra · Contratti','Contratti','Scadenze, ingaggi e rinnovi.'],mer:['Squadra · Finanze','Mercato','Budget, acquisti, cessioni e movimenti.'],pos:['Strumenti · Calcolatori','Posizione','Inserisci gli attributi e vedi la valutazione stimata in ogni posizione.'],vi:['Strumenti · Calcolatori','Vivaio','Controllo del potenziale 90+ dai rapporti dello scout.'],dat:['Impostazioni','Dati','Backup, ripristino ed esportazione.']};
function tg(){const t=document.documentElement.dataset.theme=='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('fcdb-theme',t)}catch(e){}}
try{const t=localStorage.getItem('fcdb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
let _t;function R(){$('sea').textContent=sea();$('cr').innerHTML=CI.list.map(c=>`<option value=${c.id} ${c.id==CI.cur?'selected':''}>${esc(c.name)}</option>`).join('');
$('nav').innerHTML=[['dash','Dashboard'],['db','Database'],['for','Formazioni'],['con','Contratti'],['mer','Mercato'],['pos','Posizioni'],['vi','Vivaio'],['dat','Dati']].map(([k,l])=>`<button class="tab ${T==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
const v=$('v');v.innerHTML=`<div class=ph><small>${PH[T][0]}</small><h2>${PH[T][1]}</h2><p>${PH[T][2]}</p></div>`+{dash:vDash,db:vDb,for:vFor,con:vCon,mer:vMer,pos:vPos,vi:vVi,dat:vDat}[T]();
if(_t!==T){_t=T;v.classList.remove('in');void v.offsetWidth;v.classList.add('in')}
document.querySelectorAll('.st b').forEach(e=>{const x=e.textContent.trim();if(!/^\d+(\.\d+)?$/.test(x))return;const n=parseFloat(x),d=x.includes('.')?1:0,t0=performance.now(),f=q=>{const k=Math.min(1,(q-t0)/700);e.textContent=(n*(1-Math.pow(1-k,3))).toFixed(d);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
const av=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
function vDash(){const Rs=S.players.filter(p=>p.list=='rosa'),sum=k=>S.players.filter(p=>p.list=='rosa'||p.list=='riserva').reduce((a,p)=>a+(p[k]||0),0),w=sum('wage'),res=S.bud==null?null:S.bud+S.log.reduce((a,l)=>a+l.amt,0);
const exp=S.players.filter(p=>['rosa','riserva','prestiti'].includes(p.list)&&p.yrs!=null&&p.yrs<=1),inj=Rs.filter(p=>p.inj);
const t=(l,v)=>`<div class="card st"><small>${l}</small><b>${v}</b></div>`;
return `<div class=grid>${t('In rosa',Rs.length)}${t('Valore rosa',fm(sum('val')))}${t('Monte ingaggi/sett.',fm(w))}${t('Età media',av(Rs.filter(p=>p.age).map(p=>p.age)))}${t('OVR medio',av(Rs.map(p=>p.ovr)))}${t('POT medio <small>(esatti: '+Rs.filter(p=>!p.plus).length+')</small>',av(Rs.filter(p=>!p.plus).map(p=>p.pot)))}${t('Budget trasferimenti',fm(res))}${t('Infortunati',inj.length)}</div>
${todo()}<div class=card><h4>Liste</h4>${Object.entries(LS).map(([k,v])=>`<span class=chip>${v}: ${S.players.filter(p=>p.list==k).length}</span>`).join('')}${S.wb?`<p class=mu><small>Ingaggi ${fm(w)} / ${fm(S.wb)} a settimana</small></p><div class=pb><i style="width:${Math.min(100,w/S.wb*100)}%"></i></div>`:''}</div>
<div class=card><h4>Profondità ruoli (rosa)</h4>${RO.map(r=>{const L=Rs.filter(p=>can(p,r)).sort((a,b)=>b.ovr-a.ovr);return `<span class="chip ${L.length<2?'w':''}">${r}: ${L.length}${L[0]?' · best '+L[0].ovr:''}</span>`}).join('')}<p class=mu><small>In rosso i ruoli con meno di 2 giocatori: candidati al mercato.</small></p></div>
<div class=card><h4>Contratti in scadenza (≤1 anno)</h4>${exp.map(p=>`${esc(p.name)} <small>${p.yrs==0?'SCADUTO':p.yrs+' anno'}</small>`).join('<br>')||'<small>Nessuno (o anni residui non inseriti)</small>'}</div>`}
function vDb(){const cnt=k=>k=='tutti'?S.players.length:S.players.filter(p=>p.list==k).length;
return `<div class=bar>${['tutti',...Object.keys(LS)].map(k=>`<button class="${F.l==k?'on':''}" onclick="F.l='${k}';R()">${k=='tutti'?'Tutti':LS[k]} ${cnt(k)}</button>`).join('')}</div>
<div class=bar><input placeholder="Cerca nome" value="${esc(F.q)}" oninput="F.q=this.value;tb()"><select onchange="F.role=this.value;tb()"><option value="">Ruolo</option>${opts(RO,F.role)}</select><select onchange="F.sort=this.value;tb()">${[['ovr','Ordina: OVR'],['pot','POT'],['val','Valore'],['wage','Stipendio'],['yrs','Scadenza'],['age','Età'],['role','Ruolo'],['ct','Contratto'],['n','Nome']].map(([k,l])=>`<option value=${k} ${F.sort==k?'selected':''}>${l}</option>`).join('')}</select><button class=pri onclick="edP()">+ Giocatore</button></div><div class=sc id=t>${tbl()}</div>`}
const tb=()=>$('t').innerHTML=tbl();
function srt(k){F.sort=k;R()}
function tbl(){const k={ovr:p=>-p.ovr,pot:p=>-p.pot,val:p=>-(p.val||0),wage:p=>-(p.wage||0),yrs:p=>p.yrs??99,age:p=>p.age??99,role:p=>RO.indexOf(p.role),ct:p=>CT.indexOf(p.ct)<0?99:CT.indexOf(p.ct),n:p=>p.name}[F.sort];
const L=S.players.filter(p=>(F.l=='tutti'||p.list==F.l)&&(!F.role||can(p,F.role))&&p.name.toLowerCase().includes(F.q.toLowerCase())).sort((a,b)=>{const x=k(a),y=k(b);return x>y?1:x<y?-1:b.ovr-a.ovr}),H=(key,l)=>`<th onclick="srt('${key}')">${l}${F.sort==key?' ▾':''}`;
return `<table><tr>${H('n','Giocatore')}${H('role','Ruolo')}${H('age','Età')}${H('ovr','OVR')}${H('pot','POT')}${H('val','Valore')}${H('wage','Stip.')}${H('ct','Contratto')}<th>Lista<th></tr>${L.map(p=>`<tr class=cl onclick="edP('${p.id}')"><td>${p.inj?'🩹 ':''}${esc(p.name)}<td>${[p.role,...p.sec].join('/')}<td>${p.age??'–'}<td>${rb(p.ovr)}<td>${rb(p.pot)}${p.plus?'+':''}<td>${fm(p.val)}<td>${fm(p.wage)}<td><small>${esc(p.ct||'—')}${p.yrs!=null?' · '+p.yrs+'a':''}</small><td onclick="event.stopPropagation()"><select onchange="mv('${p.id}',this.value)">${lopt(p.list)}</select><td onclick="event.stopPropagation()"><button class=dng onclick="delP('${p.id}')" title="Elimina">✕</button></tr>`).join('')||'<tr><td>Nessun giocatore</tr>'}</table>`}
function mv(id,l){const p=gp(id);p.list=l;lg(p.name+' → '+LS[l]);save();tb()}
function edP(id){const n=!id,p=id?gp(id):{name:'',role:'DC',sec:[],age:'',ovr:'',pot:'',plus:false,val:'',wage:'',ct:'',yrs:'',list:'rosa',inj:false,note:'',hist:[]};
const I=(i,l,v,t='text')=>`<label class=f><small>${l}</small><input id=${i} type=${t} value="${esc(v??'')}"></label>`,C=(i,l,c)=>`<label class=f><small>${l}</small><input id=${i} type=checkbox ${c?'checked':''}></label>`;
modal(`<h3>${n?'Nuovo giocatore':esc(p.name)}</h3><div class=fg>${I('fn','Nome (A. Bauer)',p.name)}<label class=f><small>Ruolo</small><select id=fr>${opts(RO,p.role)}</select></label>${I('fs','Ruoli sec. (es. AS/COC)',p.sec.join('/'))}${I('fa','Età',p.age,'number')}${I('fo','OVR',p.ovr,'number')}${I('fp','POT',p.pot,'number')}${C('fx','POT "+" (incerto)',p.plus)}${I('fv','Valore (es. 2.5M)',p.val)}${I('fw','Stipendio/sett. (es. 15k)',p.wage)}<label class=f><small>Tipo contratto</small><select id=fc><option value="">—</option>${opts(CT,p.ct)}</select></label>${I('fy','Anni residui',p.yrs,'number')}<label class=f><small>Lista</small><select id=fl>${lopt(p.list)}</select></label>${C('fj','Infortunato',p.inj)}${n?I('fpr','Prezzo pagato (opz.)','' ):''}</div><textarea id=fnt placeholder="Note">${esc(p.note)}</textarea>
${!n?`<h4>Storico stagioni</h4><div class=sc><table><tr><th>Stagione<th>OVR<th>POT<th>ΔOVR iniz.<th>ΔPOT iniz.</tr>${p.hist.map(h=>`<tr><td>${esc(h.s)}<td>${h.ovr}<td>${h.pot}${h.plus?'+':''}<td>${h.ovr-p.ovr0}<td>${h.pot-p.pot0}</tr>`).join('')}</table></div><small>Iniziale: OVR ${p.ovr0} · POT ${p.pot0}${p.plus0?'+':''} (non modificabile)</small>`:''}
<p><button class=pri onclick="svP('${id||''}')">Salva</button> <button onclick="cm()">Chiudi</button> ${n?'':`<button class=dng onclick="delP('${id}')">Elimina</button>`}</p>`)}

if(Rs.length&&thin.length)o.push(['🟠','Ruoli con meno di 2 giocatori: '+thin.join(', ')+'.','db']);
if(S.wb&&w>S.wb)o.push(['🔴','Ingaggi sopra il budget stipendi: '+fm(w)+' su '+fm(S.wb)+'.','mer']);
if(res!=null&&res<0)o.push(['🔴','Budget trasferimenti in negativo: '+fm(res)+'.','mer']);
if(inj.length)o.push(['🩹','Infortunati: '+nm(inj)+'.','db']);
if(mis)o.push(['ℹ️',mis+' giocatori in rosa con dati mancanti (età, valore, stipendio o contratto): completali per avvisi più precisi.','db']);
return `<div class=card><h4>Cosa fare adesso</h4>${o.map(([i,t,k])=>`<p style="margin:6px 0">${i} ${t} <button onclick="go('${k}')">Vai</button></p>`).join('')||'<span class=up>✅ Tutto in ordine</span>'}</div>`}
function rev(){const R_=S.players.filter(p=>p.list=='rosa'),mo=R_.reduce((a,p)=>a+p.ovr,0)/(R_.length||1),ws=R_.filter(p=>p.wage),mw=ws.reduce((a,p)=>a+p.wage,0)/(ws.length||1),o=[];
R_.forEach(p=>{const ex=p.yrs!=null&&p.yrs<=1,good=p.pot>=85||p.ovr>=mo,low=p.ovr<mo;
if(ex&&good)o.push({p,k:'Rinnova',w:'contratto in scadenza e giocatore di valore (POT ≥85 o OVR sopra la media)'});
if(ex&&!good)o.push({p,k:'Vendi',w:'contratto in scadenza, POT <85 e OVR sotto la media: vendi prima che scada'});
if(p.age>=30&&low&&!ex)o.push({p,k:'Vendi',w:'età ≥30 e OVR sotto la media: il valore calerà'});
if(p.wage&&ws.length>2&&p.wage>=1.5*mw&&p.ovr<=mo)o.push({p,k:'Vendi',w:'stipendio ≥1,5× la media della rosa con OVR non sopra la media'});
if(p.age>=24&&p.pot-p.ovr<=1&&low&&!p.plus)o.push({p,k:'Vendi',w:'ha raggiunto il potenziale (POT ≈ OVR) ed è sotto la media'})});return{o,mo}}
function mvR(id){const p=gp(id);p.list='trasf';lg(p.name+' → '+LS.trasf);save();R()}
function revCard(){const{o,mo}=rev();return `<div class=card><h4>Da vendere o rinnovare</h4><small>Suggerimenti da regole semplici sui dati inseriti (OVR medio rosa: ${mo.toFixed(1)}). Decidi tu.</small>${o.length?`<div class=sc><table><tr><th>Giocatore<th>Azione<th>Motivo<th></tr>${o.map(x=>`<tr><td>${esc(x.p.name)}<td><span class="chip ${x.k=='Vendi'?'w':''}">${x.k}</span><td style="white-space:normal"><small>${x.w}</small><td>${x.k=='Rinnova'?`<button onclick="rin('${x.p.id}')">Rinnova</button>`:`<button onclick="mvR('${x.p.id}')">→ Lista trasf.</button>`}</tr>`).join('')}</table></div>`:'<p class=mu><small>Nessun giocatore da segnalare. Servono età, contratto e stipendio per i controlli.</small></p>'}</div>`}
/*POS*/
const AT=[['Attacco',[['cro','Cross'],['fin','Finalizzazione'],['hea','Prec. colpi di testa'],['sho','Passaggio corto'],['vol','Volée']]],['Abilità',[['dri','Dribbling'],['cur','Effetto'],['fka','Prec. punizioni'],['lop','Passaggio lungo'],['bc','Controllo palla']]],['Movimento',[['acc','Accelerazione'],['spr','Velocità sprint'],['agi','Agilità'],['rea','Reattività'],['bal','Equilibrio']]],['Forza',[['spw','Potenza di tiro'],['jum','Elevazione'],['sta','Resistenza'],['str','Forza'],['lsh','Tiri da lontano']]],['Mentalità',[['agg','Aggressività'],['com','Freddezza'],['int','Intercettazioni'],['att','Posiz. offensivo'],['vis','Visione di gioco'],['pen','Rigorista']]],['Difesa',[['dda','Consapevolezza dif.'],['tkl','Contrasto in piedi'],['sli','Scivolata']]],['Portiere',[['gdi','Tuffo'],['gha','Presa'],['gki','Rinvio'],['gpo','Posizionamento'],['gre','Riflessi']]]];
const POS=['AS','ATT','AD','ES','COC','ED','CC','CDC','TS','DC','TD','POR'];
const W1='dri:12,acc:11,spr:11,bc:10,cro:8,fin:8,att:8,agi:7,sho:6,rea:6,bal:5,spw:4,vis:4',W2='cro:11,dri:11,bc:10,acc:10,spr:10,sho:8,lop:6,sta:6,agi:7,vis:6,att:5,rea:5,bal:5',W3='tkl:11,dda:11,spr:9,acc:9,sta:9,cro:8,int:8,sho:6,sli:6,dri:5,bc:5,agg:4,rea:4,agi:5';
const PW={ATT:'fin:19,att:14,com:9,bc:9,sho:7,acc:8,spr:8,spw:8,hea:5,dri:6,rea:7',AS:W1,AD:W1,ES:W2,ED:W2,COC:'vis:15,sho:13,bc:12,dri:10,att:9,rea:8,com:6,lop:5,agi:5,fin:5,acc:4,spw:4,lsh:4',CC:'sho:15,vis:11,bc:11,sta:9,dri:8,rea:7,lop:7,int:6,tkl:5,com:5,str:5,dda:5,bal:4,agg:2',CDC:'dda:13,tkl:12,int:12,sho:10,sta:9,str:9,agg:7,bc:6,lop:5,rea:5,com:4,sli:4,jum:4',TS:W3,TD:W3,DC:'dda:16,tkl:14,str:11,int:11,hea:10,jum:7,sli:6,agg:6,rea:5,com:4,sho:3,bc:3,spr:4',POR:'gdi:21,gha:21,gki:11,gpo:21,gre:26'};
let Q={},C={r:'',o:''},_pt;
function pcalc(){const res=POS.map(r=>{let s=0,t=0,ok=1;for(const x of PW[r].split(',')){const[k,w]=x.split(':'),v=+Q[k];if(!v){ok=0;break}s+=+w*v;t+=+w}return{r,v:ok?s/t:null}});
const b=C.r&&C.o?res.find(x=>x.r==C.r):null;if(b&&b.v!=null){const off=+C.o-b.v;res.forEach(x=>{if(x.v!=null)x.v+=off})}
res.forEach(x=>{if(x.v!=null)x.v=Math.max(1,Math.min(99,Math.round(x.v)))});return res}
const PP={ATT:[50,9],AS:[14,17],AD:[86,17],COC:[50,29],ES:[10,42],ED:[90,42],CC:[50,50],CDC:[50,64],TS:[13,76],TD:[87,76],DC:[50,81],POR:[50,93]};
function pres(){const r=pcalc(),mx=Math.max(0,...r.map(x=>x.v||0));return `<div class=fld><i class=fl style="left:28%;width:44%;top:0;height:13%"></i><i class=fl style="left:28%;width:44%;bottom:0;height:13%"></i><i class=fl style="left:0;right:0;top:47%;height:0"></i>${r.map(x=>`<div class="pn2 ${x.v&&x.v==mx?'best':''}" style="left:${PP[x.r][0]}%;top:${PP[x.r][1]}%"><small>${x.r}</small><br>${x.v==null?'–':rb(x.v)}</div>`).join('')}</div>`}
function pin(k,v){Q[k]=v;clearTimeout(_pt);_pt=setTimeout(()=>{$('pr').innerHTML=pres()},500)}
function pc(k,v){C[k]=v;$('pr').innerHTML=pres()}
function vPos(){return `<div class=card><h4>Valutazione per posizione</h4><div id=pr>${pres()}</div><p class=mu><small>Una posizione mostra il valore solo se hai compilato tutti i suoi attributi (puoi riempire solo quelli che ti servono). La posizione cerchiata in verde è la migliore. Pesi stimati, non la formula ufficiale EA.</small></p>
<div class=bar><label class=f><small>Calibra: posizione</small><select onchange="pc('r',this.value)"><option value="">–</option>${opts(POS,C.r)}</select></label><label class=f><small>OVR reale nel gioco</small><input type=number min=1 max=99 value="${esc(C.o)}" oninput="pc('o',this.value)" style="width:110px"></label><button onclick="Q={};C={r:'',o:''};R()">Azzera</button></div></div>
${AT.map(([g,L])=>`<div class=card><h4>${g}</h4><div class=ig>${L.map(([k,l])=>`<label>${l}<input type=number inputmode=numeric min=1 max=99 value="${esc(Q[k]??'')}" oninput="pin('${k}',this.value)"></label>`).join('')}</div></div>`).join('')}`}
/*END*/
function vDat(){return `<div class=card><h4>Backup e ripristino</h4><p class=mu><small>Dati salvati sul dispositivo. Il backup compare nella casella: copialo in un file note. Per ripristinare incolla il JSON.</small></p><div class=bar><button class=pri onclick="exJ()">Backup carriera attiva</button><button onclick="exA()">Backup tutte le carriere</button><button onclick="exC()">Rosa CSV</button><button onclick="cp()">Copia</button><button onclick="imp()">Ripristina</button></div><textarea id=io style="min-height:150px"></textarea><button class=dng onclick="rst()">Svuota carriera attiva</button></div>
<div class=card><h4>Registro</h4>${S.log.slice(0,20).map(l=>`<small>${l.d} · ${esc(l.t)}</small>`).join('<br>')||'<small>Vuoto</small>'}</div>`}
const exJ=()=>{$('io').value=JSON.stringify(S,null,1);$('io').select()};
function exC(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';$('io').value=['nome,ruolo,sec,eta,ovr,pot,valore,stipendio,contratto,anni,lista,infortunato',...S.players.map(p=>[p.name,p.role,p.sec.join('/'),p.age,p.ovr,p.pot+(p.plus?'+':''),p.val,p.wage,p.ct,p.yrs,LS[p.list],p.inj?'si':'no'].map(q).join(','))].join('\n')}
function cp(){$('io').select();try{navigator.clipboard.writeText($('io').value);toast('Copiato')}catch(e){document.execCommand('copy')}}
function imp(){let j;try{j=JSON.parse($('io').value);if(!Array.isArray(j.players)&&!(Array.isArray(j.careers)&&j.careers.length))throw 0}catch(e){return toast('Backup non valido')}
if(j.careers)return cfm('Sostituire TUTTE le carriere con quelle del backup?',()=>{CI.list.forEach(c=>{try{localStorage.removeItem(ck(c.id))}catch(e){}});CI={cur:null,list:[]};j.careers.forEach(c=>{const id=uid();CI.list.push({id,name:c.name||'Carriera'});try{localStorage.setItem(ck(id),JSON.stringify(c.data))}catch(e){}});CI.cur=CI.list[0].id;sIdx();S=load();FID=null;T='dash';R();toast('Ripristinato')});
cfm('Sostituire i dati della carriera attiva con il backup?',()=>{S=mig(j);save();R();toast('Ripristinato')})}
const rst=()=>cfm('Cancellare TUTTI i dati della carriera attiva? Le altre carriere non vengono toccate.',()=>{S=emptyD();FID=null;save();R()});
R();
</script></body></html>
